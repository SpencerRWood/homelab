---
default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: yamllint
        name: YAML lint
        entry: uv run yamllint .
        language: system
        pass_filenames: false
      - id: ansible-inventory
        name: Ansible inventory validation
        entry: uv run ansible-inventory --graph
        language: system
        pass_filenames: false
      - id: ansible-syntax
        name: Ansible playbook syntax
        entry: >-
          uv run ansible-playbook --syntax-check
          ansible/playbooks/homelab-host.yml
        language: system
        pass_filenames: false
      - id: ansible-lint
        name: Ansible lint
        entry: uv run ansible-lint
        language: system
        pass_filenames: false
      - id: media-compose-config
        name: Media Compose validation
        entry: scripts/validate-media-compose
        language: system
        pass_filenames: false
