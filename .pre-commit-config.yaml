---
default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: backup-configuration
        name: Backup YAML schema and coverage policy
        entry: >-
          uv run python scripts/validate-backups.py
          ansible/inventory/group_vars/homelab.yml
        language: system
        pass_filenames: false
        always_run: true
      - id: renovate-coverage
        name: Renovate configuration and image coverage
        entry: sh scripts/validate-renovate-coverage
        language: node
        language_version: 24.11.0
        additional_dependencies: [renovate@44.151.2]
        pass_filenames: false
        always_run: true
      - id: workflow-governance
        name: Publication and deployment workflow contracts
        entry: >-
          uv run python -m unittest discover
          -s tests -p test_workflow_governance.py
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/|tests/test_workflow_governance\.py)
      - id: weekly-recovery-ansible
        name: Weekly recovery Ansible syntax and lint
        entry: >-
          sh -c 'ANSIBLE_CONFIG=recovery/ansible.cfg uv run ansible-playbook
          -i localhost, recovery/weekly.yml --syntax-check &&
          ANSIBLE_CONFIG=recovery/ansible.cfg uv run ansible-lint
          recovery/weekly.yml'
        language: system
        pass_filenames: false
        always_run: true
      - id: yamllint
        name: YAML lint
        entry: uv run yamllint .
        language: system
        pass_filenames: false
      - id: ansible-inventory
        name: Ansible inventory validation
        entry: uv run ansible-inventory --graph
        language: system
        pass_filenames: false
      - id: ansible-syntax
        name: Ansible playbook syntax
        entry: >-
          sh -c 'uv run ansible-playbook --syntax-check
          ansible/playbooks/homelab-host.yml &&
          uv run ansible-playbook --syntax-check ansible/playbooks/backups.yml'
        language: system
        pass_filenames: false
      - id: ansible-lint
        name: Ansible lint
        entry: uv run ansible-lint
        language: system
        pass_filenames: false
      - id: media-compose-config
        name: Media Compose validation
        entry: scripts/validate-media-compose
        language: system
        pass_filenames: false
      - id: rollback-contract
        name: Rollback contract and health behavior
        entry: uv run python -m unittest discover -s tests
        language: system
        pass_filenames: false
        always_run: true
