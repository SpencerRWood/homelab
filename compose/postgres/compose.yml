---
name: homelab-postgres

# Dedicated runtime for home-only application databases.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    container_name: homelab-postgres
    restart: unless-stopped
    env_file:
      - /srv/homelab/secrets/runtime/postgres.env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: "${HOMELAB_POSTGRES_SUPERUSER}"
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - /srv/homelab/state/postgres/data:/var/lib/postgresql/data
    networks:
      - postgres
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  postgres:
    name: homelab-postgres
    internal: true
