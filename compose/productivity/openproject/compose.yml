---
name: projects

x-app-environment: &app-environment
  OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-true}"
  OPENPROJECT_HOST__NAME: "${OPENPROJECT_HOST__NAME:-projects.woodhost.cloud}"
  OPENPROJECT_ADDITIONAL__HOST__NAMES:
    "${OPENPROJECT_ADDITIONAL__HOST__NAMES:-projects-web}"
  OPENPROJECT_HSTS: "${OPENPROJECT_HSTS:-true}"
  OPENPROJECT_RAILS__CACHE__STORE: memcache
  OPENPROJECT_CACHE__MEMCACHE__SERVER: projects-cache:11211
  OPENPROJECT_RAILS__RELATIVE__URL__ROOT:
    "${OPENPROJECT_RAILS__RELATIVE__URL__ROOT:-}"
  OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__URL:
    "${COLLABORATIVE_SERVER_URL:-wss://projects.woodhost.cloud/hocuspocus}"
  RAILS_MIN_THREADS: "${RAILS_MIN_THREADS:-4}"
  RAILS_MAX_THREADS: "${RAILS_MAX_THREADS:-16}"
  IMAP_ENABLED: "${IMAP_ENABLED:-false}"

services:
  projects-cache:
    image: memcached:1.6@sha256:405a445c7c81bca205850426288baa5655c72859ae31d3de3fa823e6482be4ad
    container_name: projects-cache
    restart: unless-stopped

  projects-seeder:
    image: openproject/openproject:${TAG:-17-slim}
    container_name: projects-seeder
    restart: on-failure
    depends_on:
      - projects-cache
    environment: *app-environment
    env_file: &openproject-runtime-env
      - path: /srv/homelab/secrets/runtime/openproject.env
        format: raw
    command: ./docker/prod/seeder
    volumes:
      - projects_opdata:/var/openproject/assets
    networks:
      - default
      - homelab-postgres
      - legacy-database

  projects-web:
    image: openproject/openproject:${TAG:-17-slim}
    container_name: projects-web
    restart: unless-stopped
    depends_on:
      - projects-cache
      - projects-seeder
    environment: *app-environment
    env_file: *openproject-runtime-env
    command: ./docker/prod/web
    hostname: "${OPENPROJECT_HOST__NAME:-projects.woodhost.cloud}"
    volumes:
      - projects_opdata:/var/openproject/assets
      - type: bind
        source: ${OPENPROJECT_THEME_SOURCE}/_common_head.html.erb
        target: ${OPENPROJECT_THEME_TARGET}/_common_head.html.erb
        read_only: true
      - type: bind
        source: ${OPENPROJECT_THEME_SOURCE}/_paid_features_patch.html.erb
        target: ${OPENPROJECT_THEME_TARGET}/_paid_features_patch.html.erb
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health_checks/default"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - default
      - homelab-postgres
      - proxy
      - legacy-database

  projects-worker:
    image: openproject/openproject:${TAG:-17-slim}
    container_name: projects-worker
    restart: unless-stopped
    depends_on: [projects-cache, projects-seeder]
    environment: *app-environment
    env_file: *openproject-runtime-env
    command: ./docker/prod/worker
    volumes:
      - projects_opdata:/var/openproject/assets
    networks: [default, homelab-postgres, legacy-database]

  projects-cron:
    image: openproject/openproject:${TAG:-17-slim}
    container_name: projects-cron
    restart: unless-stopped
    depends_on: [projects-cache, projects-seeder]
    environment: *app-environment
    env_file: *openproject-runtime-env
    command: ./docker/prod/cron
    volumes:
      - projects_opdata:/var/openproject/assets
    networks: [default, homelab-postgres, legacy-database]

  projects-hocuspocus:
    image: openproject/hocuspocus:17.8.0@sha256:f37a8d647d172f4206308bdbf4910bbec0c19433b8870c7431fe0dc45a5a7682
    container_name: projects-hocuspocus
    restart: unless-stopped
    env_file: *openproject-runtime-env
    environment:
      OPENPROJECT_URL: "${OPENPROJECT_URL:-https://projects.woodhost.cloud}"
      OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-true}"
    depends_on: [projects-web]
    networks: [default, proxy]

volumes:
  projects_opdata:
    driver: local

networks:
  proxy:
    external: true
    name: proxy
  homelab-postgres:
    external: true
    name: homelab-postgres
  # Live runtime drift: these services also use the shared legacy database
  # network. It remains external until broader infrastructure cleanup.
  legacy-database:
    external: true
    name: database_default
