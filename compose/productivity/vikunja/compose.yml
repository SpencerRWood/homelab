---
name: tasks

services:
  vikunja-init:
    image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    container_name: vikunja-init
    command: ["sh", "-c", "chown -R 1000:0 /db /files"]
    restart: "no"
    volumes:
      - vikunja_db:/db
      - vikunja_files:/files

  vikunja:
    image: vikunja/vikunja:${VIKUNJA_IMAGE_TAG:-latest@sha256:f7dc8428d10aef17f3075886d3c1c022f566ec456f88985f02c137f4fc534576}
    container_name: vikunja
    restart: unless-stopped
    env_file:
      - path: /srv/homelab/secrets/runtime/vikunja.env
        format: raw
    environment:
      VIKUNJA_SERVICE_PUBLICURL:
        "${VIKUNJA_SERVICE_PUBLICURL:-https://tasks.woodhost.cloud}"
      VIKUNJA_SERVICE_TIMEZONE: "${VIKUNJA_SERVICE_TIMEZONE:-America/New_York}"
      VIKUNJA_SERVICE_ENABLEREGISTRATION:
        "${VIKUNJA_SERVICE_ENABLEREGISTRATION:-false}"
      VIKUNJA_DATABASE_TYPE: "${VIKUNJA_DATABASE_TYPE:-postgres}"
      VIKUNJA_DATABASE_HOST: homelab-postgres
      VIKUNJA_DATABASE_USER: "${VIKUNJA_DATABASE_USER:-vikunja}"
      VIKUNJA_DATABASE_DATABASE: "${VIKUNJA_DATABASE_DATABASE:-vikunja}"
      VIKUNJA_DATABASE_PORT: "${VIKUNJA_DATABASE_PORT:-5432}"
      VIKUNJA_DATABASE_SSLMODE: "${VIKUNJA_DATABASE_SSLMODE:-disable}"
    expose:
      - "3456"
    volumes:
      - vikunja_db:/db
      - vikunja_files:/app/vikunja/files
    depends_on:
      vikunja-init:
        condition: service_completed_successfully
    networks:
      - proxy
      - homelab-postgres

volumes:
  vikunja_db:
  vikunja_files:

networks:
  proxy:
    external: true
    name: proxy
  homelab-postgres:
    external: true
    name: homelab-postgres
