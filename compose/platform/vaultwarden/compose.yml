---
name: platform-vaultwarden

# Kept separate from the legacy private project so excluded Keycloak and
# Infisical services remain outside this repository.
services:
  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_IMAGE_TAG:-latest}
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "${VAULTWARDEN_DOMAIN}"
      SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS_ALLOWED_RUNTIME}"
      WEBSOCKET_ENABLED: "${VAULTWARDEN_WEBSOCKET_ENABLED}"
      DATABASE_URL: "${VAULTWARDEN_DATABASE_URL}"
      ROCKET_PORT: "${VAULTWARDEN_ROCKET_PORT}"
      ADMIN_TOKEN: "${VAULTWARDEN_ADMIN_TOKEN}"
    expose:
      - "80"
    volumes:
      - /srv/docker/private/config/vaultwarden:/data
    networks:
      - private-default
      - proxy
      - platform-database
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s

networks:
  private-default:
    external: true
    name: private_default
  proxy:
    external: true
    name: proxy
  platform-database:
    external: true
    name: wood-data-platform-db
