---
name: logging

services:
  loki:
    image: grafana/loki:${LOKI_IMAGE_TAG:-latest}
    container_name: logging-loki
    user: "1000:1000"
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - /srv/docker/logging/config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - /srv/docker/logging/data/loki:/loki
    networks: [logging, proxy]

  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-latest}
    container_name: logging-grafana
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "${GF_USERS_ALLOW_SIGN_UP:-false}"
      GF_DATABASE_TYPE: "${GF_DATABASE_TYPE:-postgres}"
      GF_DATABASE_HOST: "${GF_DATABASE_HOST:-homelab-postgres:5432}"
      GF_DATABASE_NAME: "${GF_DATABASE_NAME:-grafana}"
      GF_DATABASE_USER: "${GF_DATABASE_USER:-grafana}"
      GF_DATABASE_PASSWORD: "${GRAFANA_POSTGRES_PASSWORD}"
      GF_DATABASE_SSL_MODE: "${GF_DATABASE_SSL_MODE:-disable}"
    volumes:
      - /srv/docker/logging/data/grafana:/var/lib/grafana
      - /srv/docker/logging/config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [loki]
    networks: [logging, proxy, homelab-postgres]
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:3000/api/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  alloy:
    image: grafana/alloy:${ALLOY_IMAGE_TAG:-latest}
    container_name: logging-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - /srv/docker/logging/config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /srv/docker/logging/data/alloy:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    depends_on: [loki]
    networks: [logging]

networks:
  logging:
    name: logging
  proxy:
    external: true
    name: proxy
  homelab-postgres:
    external: true
    name: homelab-postgres
