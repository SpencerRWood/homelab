---
name: media-acquisition

# This project intentionally contains only the four migrated acquisition
# services.
# Its project name and media-network identity are retained because book services
# continue to use the same legacy project and are outside this migration.
services:
  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:latest@sha256:872afba91e419bf4b36673fb5afce838d9648ef6029551224e74a13911615521
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: America/New_York
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - /srv/docker/media-acquisition/config/services/sonarr:/config
      - /srv/downloads:/downloads
      - /mnt/wood-server-nas/media:/media
    networks:
      - media-network
      - proxy
    logging:
      driver: json-file
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8989/ping >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: "no"

  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest@sha256:4e13a3356643c03b2b879690d39a526b94d7a23fe63da4072427803d94180396
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: America/New_York
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - /srv/docker/media-acquisition/config/services/radarr:/config
      - /srv/downloads:/downloads
      - /mnt/wood-server-nas/media:/data
      - /mnt/wood-server-nas/media:/media
    networks:
      - media-network
      - proxy
    logging:
      driver: json-file
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:7878/ping >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: "no"

  sabnzbd:
    container_name: sabnzbd
    image: lscr.io/linuxserver/sabnzbd:latest@sha256:3ac1c9ea03bafa2588dd8acdcb809857bae305e71d2d90e11d689c78076a9c01
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: America/New_York
      HOST_WHITELIST: 0.0.0.0
    ports:
      - "127.0.0.1:8181:8080"
    volumes:
      - /srv/docker/media-acquisition/config/services/sabnzbd:/config
      - /srv/downloads:/downloads
      - /mnt/wood-server-nas/media:/media
    networks:
      - media-network
      - proxy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS 'http://127.0.0.1:8080/api?mode=version'
          >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: "no"

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:latest@sha256:59640210c491e79cadee466e9e7226d141130a0cdc9b4d012c45be3081c1e663
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: America/New_York
    ports:
      - "127.0.0.1:9696:9696"
    volumes:
      - /srv/docker/media-acquisition/config/services/prowlarr:/config
      - /mnt/wood-server-nas/media/downloads:/downloads
      - /mnt/wood-server-nas/media:/media
    networks:
      - media-network
      - proxy
    logging:
      driver: json-file
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9696/ping >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: "no"

networks:
  media-network:
    external: true
    name: media-acquisition_media-network
  proxy:
    external: true
    name: proxy
