---
name: media-acquisition

# This project intentionally contains only the four migrated acquisition
# services.
# Its project name and media-network identity are retained because book services
# continue to use the same legacy project and are outside this migration.
services:
  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:latest@sha256:897fc0a09c9949438d2763d9ee43ea40b052533f1d515a84101c91e75ed2dd04
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: America/New_York
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - /srv/docker/media-acquisition/config/services/sonarr:/config
      - /srv/downloads:/downloads
      - /mnt/wood-server-nas/media:/media
    networks:
      - media-network
      - proxy
    logging:
      driver: json-file
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8989/ping >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: "no"

  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest@sha256:dd6887a0b3b263e2615ab17c748198f5bf36afd7884178a5a6cc3c62ba3e87fa
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: America/New_York
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - /srv/docker/media-acquisition/config/services/radarr:/config
      - /srv/downloads:/downloads
      - /mnt/wood-server-nas/media:/data
      - /mnt/wood-server-nas/media:/media
    networks:
      - media-network
      - proxy
    logging:
      driver: json-file
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:7878/ping >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: "no"

  sabnzbd:
    container_name: sabnzbd
    image: lscr.io/linuxserver/sabnzbd:latest@sha256:cc7abeeafa20dfba0637d30c60bc70b79656e427c60681cb411fd7b211a39435
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: America/New_York
      HOST_WHITELIST: 0.0.0.0
    ports:
      - "127.0.0.1:8181:8080"
    volumes:
      - /srv/docker/media-acquisition/config/services/sabnzbd:/config
      - /srv/downloads:/downloads
      - /mnt/wood-server-nas/media:/media
    networks:
      - media-network
      - proxy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS 'http://127.0.0.1:8080/api?mode=version'
          >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: "no"

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:latest@sha256:b8c4198fd43d5aee9db3363c26bb942968d6e488ae43b20770d60ca691ab3b6c
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: America/New_York
    ports:
      - "127.0.0.1:9696:9696"
    volumes:
      - /srv/docker/media-acquisition/config/services/prowlarr:/config
      - /mnt/wood-server-nas/media/downloads:/downloads
      - /mnt/wood-server-nas/media:/media
    networks:
      - media-network
      - proxy
    logging:
      driver: json-file
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9696/ping >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: "no"

networks:
  media-network:
    external: true
    name: media-acquisition_media-network
  proxy:
    external: true
    name: proxy
