---
name: media-acquisition

# Canonical books payload. This shares the existing Compose project identity
# with the migrated acquisition services but declares shared networks external.
services:
  calibre:
    container_name: calibre
    image: lscr.io/linuxserver/calibre:latest@sha256:c97f86a5acc3372d5e25e75b4c98d1bffa64e70d4c413554beb1e554ae109187
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: America/New_York
    volumes:
      - /srv/docker/media-acquisition/config/services/calibre:/config
      - /mnt/wood-server-nas/media/books/calibre:/config/Calibre Library
    networks:
      - media-network
    logging:
      driver: json-file
    restart: unless-stopped

  calibre-web:
    container_name: calibre-web
    image: lscr.io/linuxserver/calibre-web:latest@sha256:80b2a77b5925441c76607619fd406694570a50a0e32c229198dbb39e72da6fed
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: America/New_York
      DOCKER_MODS: linuxserver/mods:universal-calibre
    volumes:
      - /srv/docker/media-acquisition/config/services/calibre-web:/config
      - /mnt/wood-server-nas/media/books/calibre:/books
    networks:
      - media-network
      - proxy
    logging:
      driver: json-file
    restart: unless-stopped

  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:2.37.1@sha256:581d68b2a6fc7ebf58d81c878a9f387cbbc0d88ac9d37b298b9cee10168af85b
    user: "1026:100"
    environment:
      TZ: America/New_York
    volumes:
      - /srv/docker/media-acquisition/config/services/audiobookshelf/config:/config
      - /srv/docker/media-acquisition/config/services/audiobookshelf/metadata:/metadata
      - /mnt/wood-server-nas/media/books/audiobooks:/audiobooks
    networks:
      - media-network
      - proxy
    logging:
      driver: json-file
    restart: unless-stopped

  bookshelf-audiobooks:
    container_name: bookshelf-audiobooks
    image: ghcr.io/pennydreadful/bookshelf:softcover@sha256:23defe59522d0591ade31b2a59c674648f43be47fae769d93d32bb1e038c7170
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: America/New_York
    volumes:
      - /srv/docker/media-acquisition/config/services/bookshelf-audiobooks:/config
      - /mnt/wood-server-nas/media:/media
      - /mnt/wood-server-nas/media:/data
    networks:
      - media-network
    logging:
      driver: json-file
    restart: unless-stopped

  bookshelf-ebooks:
    container_name: bookshelf-ebooks
    image: ghcr.io/pennydreadful/bookshelf:softcover@sha256:23defe59522d0591ade31b2a59c674648f43be47fae769d93d32bb1e038c7170
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: America/New_York
    volumes:
      - /srv/docker/media-acquisition/config/services/bookshelf-ebooks:/config
      - /mnt/wood-server-nas/media:/media
      - /mnt/wood-server-nas/media:/data
    networks:
      - media-network
      - proxy
    logging:
      driver: json-file
    restart: unless-stopped

  ebook-importer:
    container_name: ebook-importer
    image: lscr.io/linuxserver/calibre:latest@sha256:c97f86a5acc3372d5e25e75b4c98d1bffa64e70d4c413554beb1e554ae109187
    user: "1026:100"
    environment:
      TZ: America/New_York
      IMPORT_SCAN_SECONDS: "300"
      IMPORT_STABLE_SECONDS: "120"
    entrypoint:
      - /bin/bash
      - /automation/ebook-importer.sh
    volumes:
      - /srv/docker/scripts/ebook-importer.sh:/automation/ebook-importer.sh:ro
      - /srv/docker/media-acquisition/config/services/ebook-importer:/state
      - /mnt/wood-server-nas/media/books/ebooks:/incoming:ro
      - /mnt/wood-server-nas/media/books/calibre:/library
      - ebook-importer-config:/config
    networks:
      - media-network
    logging:
      driver: json-file
    restart: unless-stopped

networks:
  media-network:
    external: true
    name: media-acquisition_media-network
  proxy:
    external: true
    name: proxy

volumes:
  ebook-importer-config:
    external: true
    name: "5c22ba6009ba9e53444afb615fed0e154b0f453c5132bd7633202875d6998a4a"
