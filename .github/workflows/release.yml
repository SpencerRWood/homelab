---
name: Release

'on':
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_approved:
        description: Confirm separate approval to publish this main revision.
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read
  deployments: write

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' &&
      inputs.release_approved == true) ||
      github.event_name == 'push')
    uses: SpencerRWood/workflows/.github/workflows/release.yml@13c34c39c7513342ec0b970c0d23684653000c69
    with:
      require_approval: true
      workflow_revision: 13c34c39c7513342ec0b970c0d23684653000c69
      approved: ${{ inputs.release_approved }}
      automatic: ${{ github.event_name == 'push' }}
      automatic_policy_command: python3 scripts/main-deployment-policy.py

  deploy:
    needs: release
    if: >-
      github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      automatic: true
      ref: ${{ needs.release.outputs.release_tag || github.sha }}
      skip_superseded: true
