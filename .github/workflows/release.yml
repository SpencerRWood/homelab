---
name: Release

'on':
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_approved:
        description: Confirm separate approval to publish this main revision.
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read
  deployments: write

jobs:
  delivery-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      automatic_delivery: ${{ steps.scope.outputs.automatic_delivery }}
    steps:
      - name: Preserve the OP-542 backup-only integration exception
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != push ]]; then
            echo 'automatic_delivery=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          integrated_revision="$(gh api "repos/$GH_REPO/pulls/76" \
            --jq 'if .merged then .merge_commit_sha else "pending" end')"
          if [[ "$integrated_revision" == pending ||
                "$integrated_revision" == "$REVISION" ]]; then
            echo 'automatic_delivery=false' >> "$GITHUB_OUTPUT"
            echo 'OP-542: backup-only PR #76; automatic delivery held.'
          elif [[ "$integrated_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'automatic_delivery=true' >> "$GITHUB_OUTPUT"
          else
            echo 'OP-542 evidence unavailable; delivery blocked.' >&2
            exit 1
          fi

  release:
    needs: delivery-scope
    if: >-
      needs.delivery-scope.outputs.automatic_delivery == 'true' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' &&
      inputs.release_approved == true) ||
      github.event_name == 'push')
    uses: SpencerRWood/workflows/.github/workflows/release.yml@13c34c39c7513342ec0b970c0d23684653000c69
    with:
      require_approval: true
      workflow_revision: 13c34c39c7513342ec0b970c0d23684653000c69
      approved: ${{ inputs.release_approved == true }}
      automatic: ${{ github.event_name == 'push' }}
      automatic_policy_command: python3 scripts/main-deployment-policy.py

  deploy:
    needs: release
    if: >-
      github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      automatic: true
      ref: ${{ needs.release.outputs.release_tag || github.sha }}
      skip_superseded: true
