---
name: Release
'on':
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_approved:
        description: Confirm separate approval to publish this
          main revision.
        required: true
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: read
  deployments: write
jobs:
  delivery-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      automatic_delivery: ${{ steps.scope.outputs.automatic_delivery
        }}
    steps:
      - name: Preserve separately gated recovery integrations
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REVISION: ${{ github.sha }}
        run: "set -euo pipefail\nif [[ \"$EVENT_NAME\" != push\
          \ ]]; then\n  echo 'automatic_delivery=true' >> \"$GITHUB_OUTPUT\"\
          \n  exit 0\nfi\n\
          integrated_revision=\"$(gh api \"repos/$GH_REPO/pulls/76\"\
          \ \\\n  --jq 'if .merged then .merge_commit_sha else\
          \ \"pending\" end')\"\nif [[ \"$integrated_revision\"\
          \ == pending ||\n      \"$integrated_revision\" == \"\
          $REVISION\" ]]; then\n  echo 'automatic_delivery=false'\
          \ >> \"$GITHUB_OUTPUT\"\n  echo 'OP-542: backup-only\
          \ PR #76; automatic delivery held.'\nelif [[ \"$integrated_revision\"\
          \ =~ ^[0-9a-f]{40}$ ]]; then\n  recovery_integration=\"\
          $(gh api \\\n    \"repos/$GH_REPO/commits/$REVISION/pulls\"\
          \ \\\n    --jq '[.[] | select(.merged_at != null and\n\
          \      .base.ref == \"main\" and\n      .merge_commit_sha\
          \ == env.REVISION and\n      .head.ref ==\n        \"\
          fix/op-500-comprehensive-recovery-readiness-20261013\"\
          )]\n      | length')\"\n  if [[ \"$recovery_integration\"\
          \ == 1 ]]; then\n    echo 'automatic_delivery=false'\
          \ >> \"$GITHUB_OUTPUT\"\n    echo 'OP-500: recovery\
          \ integration; delivery held for approval.'\n    exit\
          \ 0\n  elif [[ \"$recovery_integration\" != 0 ]]; then\n\
          \    echo 'OP-500 authority unavailable; delivery blocked.'\
          \ >&2\n    exit 1\n  fi\n  echo 'automatic_delivery=true'\
          \ >> \"$GITHUB_OUTPUT\"\nelse\n  echo 'OP-542 evidence\
          \ unavailable; delivery blocked.' >&2\n  exit 1\nfi\n"
    if: github.ref == 'refs/heads/main' && (true)
  release:
    needs: delivery-scope
    if: needs.delivery-scope.outputs.automatic_delivery == 'true'
      && github.ref == 'refs/heads/main' && ((github.event_name
      == 'workflow_dispatch' && inputs.release_approved == true)
      || github.event_name == 'push')
    uses: SpencerRWood/workflows/.github/workflows/release.yml@4a3f40661622ae445d6ca231f31a1a6368e60ecf
    with:
      require_approval: true
      workflow_revision: 4a3f40661622ae445d6ca231f31a1a6368e60ecf
      approved: ${{ inputs.release_approved == true }}
      automatic: ${{ github.event_name == 'push' }}
      automatic_policy_command: python3 scripts/main-deployment-policy.py
  deploy:
    needs: release
    if: github.ref == 'refs/heads/main' && (github.event_name
      == 'push')
    uses: ./.github/workflows/deploy.yml
    with:
      automatic: true
      ref: ${{ needs.release.outputs.release_tag || github.sha
        }}
      skip_superseded: true
