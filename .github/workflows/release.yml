---
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  deployments: write

jobs:
  release:
    uses: SpencerRWood/workflows/.github/workflows/release.yml@v1

  deploy:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    uses: SpencerRWood/workflows/.github/workflows/deploy-ansible.yml@v1
    with:
      repository: ${{ github.repository }}
      ref: ${{ needs.release.outputs.release_tag }}
      inventory_path: ansible/inventory/homelab.yml
      playbook_path: ansible/playbooks/homelab-host.yml
      environment_name: homelab
      deployment_working_directory: .
      concurrency_group: deploy-homelab
      runner: self-hosted
      ansible_extra_vars: >-
        homelab_local_secrets_file=/Users/spencerwood/.config/wood/homelab/homelab.env
      validation_command: scripts/validate-media-compose
      check_command: >-
        ansible-playbook -i ansible/inventory/homelab.yml
        ansible/playbooks/homelab-host.yml --tags storage --check --diff
      health_check_command: bash scripts/health-check.sh
