---
name: Deploy released homelab configuration
'on':
  workflow_call:
    inputs:
      automatic:
        description: Validated main-push delivery authorized by
          repository policy.
        required: false
        type: boolean
        default: false
      deployment_approved:
        description: Confirm separate deployment or rollback authorization.
        required: false
        type: boolean
        default: false
      ref:
        description: Immutable repository release tag.
        required: true
        type: string
      skip_superseded:
        description: Skip an automated deployment when a newer
          main commit exists.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      deployment_approved:
        description: Confirm separate deployment or rollback authorization.
        required: true
        type: boolean
        default: false
      release:
        description: Existing release tag; leave empty to deploy
          the latest release.
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read
  deployments: write
jobs:
  resolve-release:
    if: github.ref == 'refs/heads/main' && ((github.event_name
      == 'workflow_dispatch' && inputs.deployment_approved ==
      true) || (github.event_name == 'push' && inputs.automatic
      == true))
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve exact deployment revision
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.ref || inputs.release }}
          AUTOMATIC: ${{ inputs.automatic }}
        run: "set -euo pipefail\nif [[ \"$AUTOMATIC\" == true\
          \ &&\n      \"$REQUESTED_REF\" =~ ^[a-f0-9]{40}$ ]];\
          \ then\n  test \"$GITHUB_EVENT_NAME\" = push\n  test\
          \ \"$GITHUB_REF\" = refs/heads/main\n  test \"$REQUESTED_REF\"\
          \ = \"$GITHUB_SHA\"\n  ref=\"$REQUESTED_REF\"\nelif\
          \ [[ -n \"$REQUESTED_REF\" ]]; then\n  ref=$(gh release\
          \ view \"$REQUESTED_REF\" --repo \"$GITHUB_REPOSITORY\"\
          \ \\\n    --json isDraft,tagName \\\n    --jq 'select(.isDraft\
          \ == false) | .tagName')\nelse\n\
          \  ref=$(gh api \"repos/$GITHUB_REPOSITORY/releases/latest\"\
          \ \\\n    --jq .tag_name)\nfi\ntest -n \"$ref\"\nprintf\
          \ 'ref=%s\\n' \"$ref\" >> \"$GITHUB_OUTPUT\"\n"
  deploy:
    needs: resolve-release
    if: github.ref == 'refs/heads/main' && ((github.event_name
      == 'workflow_dispatch' && inputs.deployment_approved ==
      true) || (github.event_name == 'push' && inputs.automatic
      == true))
    uses: SpencerRWood/workflows/.github/workflows/deploy-ansible.yml@9748b1cd6287d84d55c4277c93ca5dae01fb1787
    with:
      require_approval: true
      approved: ${{ inputs.deployment_approved }}
      automatic: ${{ inputs.automatic == true }}
      automatic_policy_command: python3 scripts/main-deployment-policy.py
      allow_main_commit: ${{ inputs.automatic == true }}
      repository: ${{ github.repository }}
      ref: ${{ needs.resolve-release.outputs.ref }}
      skip_superseded: ${{ inputs.skip_superseded == true }}
      inventory_path: ansible/inventory/homelab.yml
      playbook_path: ansible/playbooks/homelab-host.yml
      environment_name: homelab
      deployment_working_directory: .
      concurrency_group: deploy-homelab
      runner: '["self-hosted", "linux", "x64", "beelink", "homelab"]'
      ansible_extra_vars: homelab_local_secrets_file=/home/github-runner-homelab/.secrets/homelab.env
      validation_command: scripts/validate-media-compose
      check_command: uv run ansible-playbook -i ansible/inventory/homelab.yml
        ansible/playbooks/homelab-host.yml --tags storage --check
        --diff
      privileged_check_command: >-
        sudo -n /usr/local/sbin/github-runner-homelab-deploy
        "$GITHUB_WORKSPACE" release-check
      health_check_command: bash scripts/health-check.sh
      privileged_deploy_command: >-
        sudo -n /usr/local/sbin/github-runner-homelab-deploy
        "$GITHUB_WORKSPACE" release-apply
      privileged_health_check_command: >-
        sudo -n /usr/local/sbin/github-runner-homelab-deploy
        "$GITHUB_WORKSPACE" release-health
      privileged_rollback_command: >-
        sudo -n /usr/local/sbin/github-runner-homelab-deploy
        "$GITHUB_WORKSPACE" release-rollback
      deployment_state_file: /var/lib/github-actions-deployments/github-runner-homelab/homelab.json
      workflow_revision: 9748b1cd6287d84d55c4277c93ca5dae01fb1787
