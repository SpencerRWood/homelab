---
name: Validate

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation tools
        run: pip install ansible ansible-lint pre-commit ruff yamllint
      - name: Run pre-commit checks
        run: pre-commit run --all-files
      - name: Validate inventory
        run: ansible-inventory --inventory ansible/inventory/homelab.yml --graph
      - name: Validate playbook syntax
        run: ansible-playbook --syntax-check ansible/playbooks/beelink.yml
      - name: Lint Ansible
        run: ansible-lint
      - name: Lint Python helpers
        run: ruff check scripts
