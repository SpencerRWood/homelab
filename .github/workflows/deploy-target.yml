---
name: Deploy target configuration

'on':
  workflow_call:
    inputs:
      ref:
        description: Immutable repository release tag.
        required: true
        type: string
      skip_superseded:
        description: >-
          Skip an automated deployment when a newer main commit exists.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: SpencerRWood/workflows/.github/workflows/deploy-ansible.yml@v1
    with:
      repository: ${{ github.repository }}
      ref: ${{ inputs.ref }}
      skip_superseded: ${{ inputs.skip_superseded }}
      inventory_path: ansible/inventory/homelab.yml
      playbook_path: ansible/playbooks/homelab-host.yml
      environment_name: homelab
      deployment_working_directory: .
      concurrency_group: deploy-homelab
      runner: '["self-hosted", "linux", "x64", "beelink", "homelab"]'
      ansible_extra_vars: >-
        homelab_local_secrets_file=/home/github-runner-homelab/.secrets/homelab.env
      validation_command: scripts/validate-media-compose
      check_command: >-
        uv run ansible-playbook -i ansible/inventory/homelab.yml
        ansible/playbooks/homelab-host.yml --tags storage --check --diff
      privileged_check_command: >-
        sudo -n /usr/local/sbin/github-runner-homelab-deploy
        "$GITHUB_WORKSPACE" check
      health_check_command: bash scripts/health-check.sh
      privileged_deploy_command: >-
        sudo -n /usr/local/sbin/github-runner-homelab-deploy
        "$GITHUB_WORKSPACE" apply
      privileged_health_check_command: >-
        sudo -n /usr/local/sbin/github-runner-homelab-deploy
        "$GITHUB_WORKSPACE" health
      deployment_state_file: >-
        /var/lib/github-actions-deployments/github-runner-homelab/homelab.json
