---
- name: Check the local canonical secret source
  ansible.builtin.stat:
    path: "{{ homelab_local_secrets_file }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: compose_local_secrets_file
  changed_when: false
  tags:
    [books_compose, productivity_compose, platform_compose, postgres, secrets]

- name: Require the local canonical secret source
  ansible.builtin.assert:
    that:
      - compose_local_secrets_file.stat.exists
      - compose_local_secrets_file.stat.isreg
      - compose_local_secrets_file.stat.readable
    fail_msg: >-
      Canonical Compose deployment requires the control-node secret source at
      {{ homelab_local_secrets_file }}. Copy homelab.env.example outside Git,
      populate it through the approved secret workflow, and load it with direnv.
  delegate_to: localhost
  become: false
  run_once: true
  tags:
    [books_compose, productivity_compose, platform_compose, postgres, secrets]

- name: Create the canonical server-side secret directory
  ansible.builtin.file:
    path: "{{ homelab_secrets_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags:
    [books_compose, productivity_compose, platform_compose, postgres, secrets]

- name: Deploy the canonical server-side secret file
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', homelab_local_secrets_file) }}"
    dest: "{{ homelab_secrets_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags:
    [books_compose, productivity_compose, platform_compose, postgres, secrets]

- name: Create the dedicated Postgres Compose directory
  ansible.builtin.file:
    path: "{{ homelab_compose_root }}/postgres"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [postgres]

- name: Require dedicated Postgres role name
  ansible.builtin.assert:
    that:
      - >-
        lookup('ansible.builtin.file', homelab_local_secrets_file)
        is regex('(?m)^HOMELAB_POSTGRES_SUPERUSER=.+$')
    fail_msg: >-
      Populate HOMELAB_POSTGRES_SUPERUSER in the ignored local homelab.env
      before deploying Postgres.
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  tags: [postgres]

- name: Create the dedicated Postgres persistent-state directory
  ansible.builtin.file:
    path: "{{ homelab_postgres_data_dir }}"
    state: directory
    owner: "999"
    group: "999"
    mode: "0700"
  tags: [postgres]

- name: Deploy the dedicated Postgres Compose payload
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../compose/postgres/compose.yml"
    dest: "{{ homelab_compose_root }}/postgres/compose.yml"
    owner: root
    group: root
    mode: "0644"
  tags: [postgres]

- name: Verify the dedicated Postgres Compose payload
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ homelab_secrets_file }}
      -f {{ homelab_compose_root }}/postgres/compose.yml config --quiet
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode
  tags: [postgres]

- name: Start the dedicated Postgres service
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ homelab_secrets_file }}
      -f {{ homelab_compose_root }}/postgres/compose.yml up -d postgres
  register: compose_postgres_up
  changed_when: >-
    'Created' in compose_postgres_up.stderr or
    'Started' in compose_postgres_up.stderr or
    'Recreated' in compose_postgres_up.stderr
  check_mode: false
  no_log: true
  when: not ansible_check_mode
  tags: [postgres]

- name: Create the canonical books Compose directory
  ansible.builtin.file:
    path: "{{ homelab_compose_root }}/books"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [books_compose]

- name: Deploy the canonical books Compose payload
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../compose/books/compose.yml"
    dest: "{{ homelab_compose_root }}/books/compose.yml"
    owner: root
    group: root
    mode: "0644"
  tags: [books_compose]

- name: Verify the canonical books Compose payload
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ homelab_compose_root }}/books/compose.yml
      config --quiet
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
  tags: [books_compose]

- name: Apply pinned Calibre images to the canonical books services
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ homelab_compose_root }}/books/compose.yml
      up -d --no-deps calibre ebook-importer
  register: compose_calibre_up
  changed_when: >-
    'Created' in compose_calibre_up.stderr or
    'Started' in compose_calibre_up.stderr or
    'Recreated' in compose_calibre_up.stderr
  check_mode: false
  when: not ansible_check_mode
  tags: [books_compose]

- name: Create canonical productivity Compose project directories
  ansible.builtin.file:
    path: "{{ homelab_compose_root }}/productivity/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - recipes
    - vikunja
    - openproject
  tags: [productivity_compose]

- name: Check the deployed platform Compose secrets file
  ansible.builtin.stat:
    path: "{{ homelab_secrets_file }}"
  register: compose_platform_secrets_file
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
  tags: [platform_compose]

- name: Require the deployed platform Compose secrets file
  ansible.builtin.assert:
    that:
      - compose_platform_secrets_file.stat.exists
      - compose_platform_secrets_file.stat.readable
    fail_msg: >-
      Platform Compose deployment requires {{ homelab_secrets_file }}.
      Create it from the names-only homelab.env.example contract without
      committing secret values.
  check_mode: false
  when: not ansible_check_mode
  tags: [platform_compose]

- name: Create canonical platform Compose project directories
  ansible.builtin.file:
    path: "{{ homelab_compose_root }}/platform/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - caddy
    - logging
    - code-server
    - vaultwarden
  tags: [platform_compose]

- name: Link canonical platform Compose projects to centralized secrets
  ansible.builtin.file:
    src: "{{ homelab_secrets_file }}"
    dest: "{{ homelab_compose_root }}/platform/{{ item }}/.env"
    state: link
  loop:
    - caddy
    - logging
    - code-server
    - vaultwarden
  tags: [platform_compose]

- name: Deploy canonical platform Compose payloads
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../compose/platform/{{ item }}/compose.yml"
    dest: "{{ homelab_compose_root }}/platform/{{ item }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  loop:
    - caddy
    - logging
    - code-server
    - vaultwarden
  tags: [platform_compose]

- name: Deploy the canonical Caddy Dockerfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../compose/platform/caddy/Dockerfile"
    dest: "{{ homelab_compose_root }}/platform/caddy/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  tags: [platform_compose]

- name: Deploy the canonical Caddy Cloudflare DNS module
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../compose/platform/caddy/modules/"
    dest: "{{ homelab_compose_root }}/platform/caddy/modules/"
    owner: root
    group: root
    mode: preserve
  tags: [platform_compose]

- name: Deploy the canonical code-server Dockerfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../compose/platform/code-server/Dockerfile"
    dest: "{{ homelab_compose_root }}/platform/code-server/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  tags: [platform_compose]

- name: Verify canonical platform Compose payloads
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ homelab_secrets_file }}
      -f {{ homelab_compose_root }}/platform/{{ item }}/compose.yml
      config --quiet
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
  loop:
    - caddy
    - logging
    - code-server
    - vaultwarden
  tags: [platform_compose]

- name: Deploy canonical productivity Compose payloads
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../compose/productivity/{{ item }}/compose.yml"
    dest: "{{ homelab_compose_root }}/productivity/{{ item }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  loop:
    - recipes
    - vikunja
    - openproject
  tags: [productivity_compose]

- name: Verify canonical productivity Compose payloads
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ homelab_secrets_file }}
      -f {{ homelab_compose_root }}/productivity/{{ item }}/compose.yml
      config --quiet
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
  loop:
    - recipes
    - vikunja
    - openproject
  tags: [productivity_compose]
