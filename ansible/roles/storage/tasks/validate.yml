---
- name: Inspect converged NFS mount details without changing runtime state
  ansible.builtin.command:
    cmd: >-
      findmnt --noheadings --raw --output SOURCE,FSTYPE,OPTIONS
      --target {{ item.value.path }}
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ storage_mounts | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: storage_converged_mounts

- name: Assert each managed path remains the expected read-write NFSv3 mount
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - >-
        item.stdout.split()[0] == storage_nas_address ~ ':' ~
        item.item.value.export
      - item.stdout.split()[1] is match('^nfs')
      - "'rw' in item.stdout.split()[2].split(',')"
      - >-
        'vers=3' in item.stdout.split()[2].split(',') or
        'nfsvers=3' in item.stdout.split()[2].split(',')
    fail_msg: >-
      {{ item.item.value.path }} is not the expected read-write NFSv3 mount from
      {{ storage_nas_address }}:{{ item.item.value.export }}:
      {{ item.stdout | default('not mounted') }}
  loop: "{{ storage_converged_mounts.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Read managed fstab records without changing them
  ansible.builtin.command:
    argv:
      - awk
      - >-
        $2 == "{{ item.value.path }}" { print $1 "|" $3 "|" $4 }
      - /etc/fstab
  changed_when: false
  check_mode: false
  loop: "{{ storage_mounts | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: storage_fstab_records
  when: not ansible_check_mode

- name: Assert exactly one expected fstab record exists for every managed mount
  ansible.builtin.assert:
    that:
      - item.stdout_lines | length == 1
      - >-
        item.stdout == storage_nas_address ~ ':' ~ item.item.value.export ~
        '|' ~ item.item.value.fstype ~ '|' ~ item.item.value.options
    fail_msg: >-
      Expected one fstab record for {{ item.item.value.path }} with the managed
      source, type, and options; found:
      {{ item.stdout_lines }}
  loop: "{{ storage_fstab_records.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: not ansible_check_mode
