---
- name: Create the canonical books Compose directory
  ansible.builtin.file:
    path: "{{ homelab_compose_root }}/books"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [books_compose]

- name: Deploy the canonical books Compose payload
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../compose/books/compose.yml"
    dest: "{{ homelab_compose_root }}/books/compose.yml"
    owner: root
    group: root
    mode: "0644"
  tags: [books_compose]

- name: Verify the canonical books Compose payload
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ homelab_compose_root }}/books/compose.yml
      config --quiet
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
  tags: [books_compose]
