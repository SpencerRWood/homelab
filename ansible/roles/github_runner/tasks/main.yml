---
- name: Create dedicated GitHub runner group
  ansible.builtin.group:
    name: "{{ github_runner_group }}"
    system: true

- name: Create dedicated GitHub runner account
  ansible.builtin.user:
    name: "{{ github_runner_user }}"
    group: "{{ github_runner_group }}"
    system: true
    create_home: true

- name: Create GitHub runner directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ github_runner_root }}", mode: '0755'}
    - {path: "/home/{{ github_runner_user }}/.secrets", mode: '0700'}

- name: Install local Ansible control dependencies
  ansible.builtin.apt:
    name:
      - ansible
      - ca-certificates
      - curl
      - git
      - libicu74
    state: present
    update_cache: true

- name: Create durable runner deployment metadata directory
  ansible.builtin.file:
    path: "{{ github_runner_deployment_state_dir }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_group }}"
    mode: '0750'

- name: Check GitHub runner registration
  ansible.builtin.stat:
    path: "{{ github_runner_root }}/.runner"
  register: github_runner_registration

- name: Install GitHub runner archive
  ansible.builtin.unarchive:
    # noqa yaml[line-length]
    src: "https://github.com/actions/runner/releases/download/v{{ github_runner_version }}/actions-runner-linux-x64-{{ github_runner_version }}.tar.gz"  # yamllint disable-line rule:line-length
    dest: "{{ github_runner_root }}"
    remote_src: true
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_group }}"
    creates: "{{ github_runner_root }}/run.sh"

- name: Require a short-lived registration token for first bootstrap
  ansible.builtin.assert:
    that: github_runner_registration_token | length > 0
    fail_msg: >-
      Set GITHUB_RUNNER_HOMELAB_TOKEN only for first runner registration.
  when: not github_runner_registration.stat.exists
  no_log: true

- name: Register GitHub runner once
  ansible.builtin.command:
    argv:
      - "{{ github_runner_root }}/config.sh"
      - --unattended
      - --url
      - "https://github.com/{{ github_runner_repository }}"
      - --token
      - "{{ github_runner_registration_token }}"
      - --name
      - "{{ github_runner_name }}"
      - --labels
      - "{{ github_runner_labels }}"
      - --work
      - _work
  become: true
  become_user: "{{ github_runner_user }}"
  when: not github_runner_registration.stat.exists
  no_log: true
  changed_when: true

- name: Deploy runner-only homelab secret source
  ansible.builtin.copy:
    src: "{{ github_runner_secret_source }}"
    dest: "{{ github_runner_secret_file }}"
    remote_src: true
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_group }}"
    mode: '0600'
  no_log: true

- name: Install the root-owned canonical deployment wrapper
  ansible.builtin.template:
    src: deploy-wrapper.sh.j2
    dest: "{{ github_runner_deployment_wrapper }}"
    owner: root
    group: root
    mode: '0750'

- name: Permit only the canonical deployment wrapper through sudo
  ansible.builtin.copy:
    # noqa yaml[line-length]
    content: "{{ github_runner_user }} ALL=(root) NOPASSWD: {{ github_runner_deployment_wrapper }}\n"  # yamllint disable-line rule:line-length
    dest: "/etc/sudoers.d/{{ github_runner_name }}"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Install GitHub runner systemd unit
  ansible.builtin.template:
    src: github-runner.service.j2
    dest: "/etc/systemd/system/{{ github_runner_name }}.service"
    mode: '0644'

- name: Enable and start GitHub runner
  ansible.builtin.systemd_service:
    name: "{{ github_runner_name }}"
    enabled: true
    state: started
    daemon_reload: true
