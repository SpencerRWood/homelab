---
github_runner_name: github-runner-homelab
github_runner_user: github-runner-homelab
github_runner_group: github-runner-homelab
github_runner_root: "/opt/{{ github_runner_name }}"
github_runner_version: 2.337.0
github_runner_labels: beelink,homelab
github_runner_repository: SpencerRWood/homelab
github_runner_registration_token: >-
  {{ lookup('ansible.builtin.env', 'GITHUB_RUNNER_HOMELAB_TOKEN') }}
github_runner_secret_source: "{{ homelab_secrets_file }}"
github_runner_secret_file: "/home/{{ github_runner_user }}/.secrets/homelab.env"
github_runner_deployment_state_dir: >-
  /var/lib/github-actions-deployments/{{ github_runner_name }}
github_runner_deployment_wrapper: >-
  /usr/local/sbin/{{ github_runner_name }}-deploy
github_runner_inventory_path: ansible/inventory/homelab.yml
github_runner_playbook_path: ansible/playbooks/homelab-host.yml
github_runner_health_command: bash scripts/health-check.sh
github_runner_ansible_extra_args: >-
  --extra-vars homelab_local_secrets_file={{ github_runner_secret_file }}
