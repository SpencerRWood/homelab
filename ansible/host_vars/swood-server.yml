---
# The managed host connection is non-secret. Authentication remains outside Git.
ansible_host: 192.168.1.21
ansible_user: spencerwood

# Non-secret contracts. Set values before an implementing role uses them.
# Null means this repository does not assert a value yet.
homelab_administrative_user: null
homelab_deployment_user: null
homelab_administrative_uid: null
homelab_administrative_gid: null
homelab_deployment_uid: null
homelab_deployment_gid: null
homelab_beelink_lan_address: null

homelab_nas_hostname: null
homelab_nas_address: "192.168.1.10"

homelab_mounts:
  media:
    export: "/volume1/media"
    path: "/mnt/wood-server-nas/media"
    fstype: "nfs"
    options: "nfsvers=3,rw,hard,_netdev,nofail"
    required_for_runtime: true
    boot_policy: "host-nonblocking-workload-required"
  database:
    export: "/volume1/database"
    path: "/mnt/wood-server-nas/database"
    fstype: "nfs"
    options: "nfsvers=3,rw,hard,_netdev,nofail"
    required_for_runtime: false
    boot_policy: "nonblocking"
  backup_server:
    export: "/volume1/backup_server"
    path: "/mnt/wood-server-nas/backup_server"
    fstype: "nfs"
    options: "nfsvers=3,rw,hard,_netdev,nofail"
    required_for_runtime: false
    boot_policy: "nonblocking"
