---
- name: Deploy only the Mealie Infisical canary
  hosts: homelab
  become: true
  gather_facts: false
  vars:
    source_root: "{{ playbook_dir }}/../.."
    recipe_dir: compose/productivity/recipes
  tasks:
    - name: Require protected Mealie machine identity
      ansible.builtin.stat:
        path: /srv/homelab/secrets/bootstrap/infisical-mealie.json
      register: mealie_identity

    - name: Check machine identity file permissions
      ansible.builtin.assert:
        that:
          - mealie_identity.stat.exists
          - mealie_identity.stat.isreg
          - mealie_identity.stat.pw_name == 'root'
          - mealie_identity.stat.mode == '0600'
        fail_msg: >-
          Mealie machine identity must be root-owned with mode 0600.

    - name: Install Mealie canary Compose definition
      ansible.builtin.copy:
        src: "{{ source_root }}/{{ recipe_dir }}/compose.infisical.yml"
        dest: /srv/homelab/compose/productivity/recipes/compose.infisical.yml
        owner: root
        group: root
        mode: '0644'

    - name: Install Mealie secret resolver
      ansible.builtin.copy:
        src: "{{ source_root }}/scripts/resolve-mealie-secret.py"
        dest: /usr/local/sbin/resolve-mealie-secret.py
        owner: root
        group: root
        mode: '0755'

    - name: Install Mealie canary deployment command
      ansible.builtin.copy:
        src: "{{ source_root }}/scripts/deploy-mealie-infisical"
        dest: /usr/local/sbin/deploy-mealie-infisical
        owner: root
        group: root
        mode: '0755'

    - name: Install Mealie rollback command
      ansible.builtin.copy:
        src: "{{ source_root }}/scripts/rollback-mealie-infisical"
        dest: /usr/local/sbin/rollback-mealie-infisical
        owner: root
        group: root
        mode: '0755'

    - name: Deploy Mealie from Infisical
      ansible.builtin.command:
        cmd: /usr/local/sbin/deploy-mealie-infisical --recreate
      changed_when: true
      no_log: true

    - name: Install Mealie boot unit
      ansible.builtin.copy:
        src: "{{ source_root }}/systemd/mealie-infisical.service"
        dest: /etc/systemd/system/mealie-infisical.service
        owner: root
        group: root
        mode: '0644'

    - name: Enable Mealie boot unit
      ansible.builtin.systemd_service:
        name: mealie-infisical.service
        daemon_reload: true
        enabled: true
