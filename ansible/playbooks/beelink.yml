---
- name: Configure the Beelink homelab host
  hosts: homelab
  become: true
  gather_facts: false
  vars_files:
    - ../host_vars/swood-server.yml
  roles:
    - role: base
    - role: users
    - role: storage
    - role: docker
    - role: directories
    - role: permissions
    - role: networking
    - role: security
    - role: systemd
    - role: github_runner
    - role: backup
