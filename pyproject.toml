[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-repository-tooling"
version = "0.0.0"
description = "Validation tooling for the homelab repository"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
